      </header>
      <h1>Form</h1>
      <section id="form-with-js" class="submission-form">
          <h2>Form with JS</h2>
          <form action="https://httpbin.org/post" method="POST">
              <fieldset>
                  <legend>Your information</legend>
                  <label for="name">Full Name:</label>
                  <input
                      type="text"
                      id="name"
                      name="name"
                      autocomplete="name"
                      minlength="2"
                      maxlength="100"
                      required
                      aria-describedby="name-error"
                  >
                  <label for="email">Email:</label>
                  <input
                      type="email"
                      id="email"
                      name="email"
                      autocomplete="email"
                      required
                      aria-describedby="email-error"
                  >
              </fieldset>
              <fieldset class="comments-fieldset">
                <legend>Comments</legend>
                <label for="comments">Comments:</label>
                <textarea
                    id="comments"
                    name="comments"
                    minlength="10"
                    maxlength="1000"
                    required
                    aria-describedby="comments-error info-area"
                ></textarea>
              </fieldset>
              <p id="form-errors" role="region" aria-label="Form errors" aria-live="polite"></p>
              <input type="hidden" name="possible_bot" value="true">
              <input type="hidden" id="form-errors-history" name="form-errors" value="">
              <button type="submit">Submit</button>
          </form>
      </section>
